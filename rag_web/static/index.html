<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ask the documents</title>

  <!-- React without a build step. Babel compiles the JSX below in the
       browser, which is why there is no npm, no node_modules and no bundler.
       Fine for a local tool; a production app would precompile instead. -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --bg: #f6f7f9;
      --card: #ffffff;
      --ink: #1a1c1f;
      --muted: #6b7280;
      --line: #e3e6ea;
      --accent: #2f6fed;
      --accent-soft: #eaf0fe;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14161a; --card: #1c1f24; --ink: #e8eaed; --muted: #9aa3ad;
        --line: #2b3038; --accent: #6b9bff; --accent-soft: #1e2636;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; background: var(--bg); color: var(--ink);
      font: 15px/1.6 -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .wrap { max-width: 860px; margin: 0 auto; padding: 32px 20px 80px; }

    header h1 { font-size: 22px; margin: 0 0 4px; }
    header .sub { color: var(--muted); font-size: 13px; }
    .pill {
      display: inline-block; padding: 2px 9px; border-radius: 999px;
      background: var(--accent-soft); color: var(--accent);
      font-size: 12px; font-weight: 600; margin-right: 6px;
    }

    .ask { margin: 24px 0; }
    .row { display: flex; gap: 8px; }
    textarea {
      flex: 1; padding: 12px 14px; border: 1px solid var(--line);
      border-radius: 10px; background: var(--card); color: var(--ink);
      font: inherit; resize: vertical; min-height: 52px;
    }
    textarea:focus { outline: 2px solid var(--accent); border-color: transparent; }
    button {
      padding: 0 20px; border: 0; border-radius: 10px; background: var(--accent);
      color: #fff; font: inherit; font-weight: 600; cursor: pointer;
    }
    button:disabled { opacity: .5; cursor: default; }
    .opts { margin-top: 10px; display: flex; gap: 14px; align-items: center;
            color: var(--muted); font-size: 13px; flex-wrap: wrap; }
    .opts input[type=range] { width: 130px; vertical-align: middle; }

    .examples { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
    .examples button {
      background: transparent; border: 1px solid var(--line); color: var(--muted);
      font-size: 13px; font-weight: 400; padding: 5px 11px; border-radius: 999px;
    }
    .examples button:hover { border-color: var(--accent); color: var(--accent); }

    .card {
      background: var(--card); border: 1px solid var(--line);
      border-radius: 12px; padding: 18px 20px; margin-bottom: 14px;
    }
    .answer { white-space: pre-wrap; }
    .qline { color: var(--muted); font-size: 13px; margin-bottom: 10px; }

    .srcheading {
      margin: 18px 0 8px; font-size: 12px; text-transform: uppercase;
      letter-spacing: .05em; color: var(--muted);
    }
    .src { border-top: 1px solid var(--line); padding: 12px 0; }
    .src:last-child { padding-bottom: 0; }
    .srctop { display: flex; gap: 8px; align-items: baseline;
              font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .num {
      background: var(--accent-soft); color: var(--accent); font-weight: 700;
      border-radius: 5px; padding: 1px 7px;
    }
    .bar { flex: 1; height: 4px; background: var(--line); border-radius: 2px;
           max-width: 110px; overflow: hidden; }
    .bar i { display: block; height: 100%; background: var(--accent); }
    .srctext { font-size: 14px; color: var(--ink); }
    .srctext.clipped {
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .more { background: none; border: 0; color: var(--accent); padding: 4px 0;
            font-size: 12px; font-weight: 600; cursor: pointer; }

    /* --- settings dialog --- */
    .gear {
      background: transparent; border: 1px solid var(--line); color: var(--ink);
      font-size: 13px; font-weight: 500; padding: 5px 12px; border-radius: 8px;
    }
    .gear:hover { border-color: var(--accent); color: var(--accent); }
    dialog {
      border: 1px solid var(--line); border-radius: 14px; padding: 0;
      background: var(--card); color: var(--ink); max-width: 460px; width: 92%;
      box-shadow: 0 16px 48px rgba(0,0,0,.22);
    }
    dialog::backdrop { background: rgba(0,0,0,.45); }
    .dlg { padding: 22px 24px 20px; }
    .dlg h2 { margin: 0 0 4px; font-size: 17px; }
    .dlg .hint { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
    .kval { font-size: 30px; font-weight: 700; color: var(--accent);
            text-align: center; margin: 4px 0 2px; }
    .kcap { text-align: center; color: var(--muted); font-size: 12px;
            margin-bottom: 14px; }
    .dlg input[type=range] { width: 100%; }
    .presets { display: flex; gap: 6px; margin: 14px 0 4px; }
    .presets button {
      flex: 1; background: transparent; border: 1px solid var(--line);
      color: var(--muted); font-size: 13px; font-weight: 500; padding: 7px 0;
      border-radius: 8px;
    }
    .presets button.on { border-color: var(--accent); color: var(--accent);
                         background: var(--accent-soft); font-weight: 700; }
    .guide { width: 100%; border-collapse: collapse; margin-top: 16px;
             font-size: 13px; }
    .guide td { padding: 6px 0; border-top: 1px solid var(--line);
                color: var(--muted); vertical-align: top; }
    .guide td:first-child { color: var(--ink); font-weight: 600;
                            white-space: nowrap; padding-right: 14px; }
    .dlgfoot { display: flex; justify-content: flex-end; gap: 8px;
               padding: 14px 24px; border-top: 1px solid var(--line); }

    .opt {
      display: flex; align-items: center; gap: 12px; padding: 11px 12px;
      border: 1px solid var(--line); border-radius: 10px; margin-bottom: 8px;
      cursor: pointer;
    }
    .opt.on { border-color: var(--accent); background: var(--accent-soft); }
    .optmain { flex: 1; min-width: 0; }
    .optlabel { font-weight: 600; font-size: 14px; }
    .tick { color: var(--accent); font-size: 12px; font-weight: 700;
            margin-left: 8px; }
    .optmeta { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .built { color: var(--muted); font-size: 12px; white-space: nowrap; }
    .buildbtn { font-size: 12px; padding: 6px 12px; border-radius: 8px;
                white-space: nowrap; }

    .drop {
      border: 2px dashed var(--line); border-radius: 10px; padding: 18px;
      text-align: center; color: var(--muted); font-size: 13px;
      cursor: pointer; margin-bottom: 12px;
    }
    .drop.over { border-color: var(--accent); background: var(--accent-soft);
                 color: var(--accent); }
    .doc {
      display: flex; align-items: center; gap: 10px; font-size: 13px;
      padding: 7px 10px; border: 1px solid var(--line); border-radius: 8px;
      margin-bottom: 6px;
    }
    .doc .kind {
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      background: var(--accent-soft); color: var(--accent);
      padding: 2px 6px; border-radius: 4px;
    }
    .doc .nm { flex: 1; min-width: 0; overflow: hidden;
               text-overflow: ellipsis; white-space: nowrap; }
    .doc .sz { color: var(--muted); font-size: 12px; }
    .doc .x { background: none; border: 0; color: var(--muted);
              cursor: pointer; font-size: 15px; padding: 0 2px; }
    .doc .x:hover { color: #c0392b; }
    .stale { color: #b06a00; font-size: 12px; font-weight: 600; }

    .err { border-color: #e2b4b4; background: #fdf3f3; color: #8a2b2b; }
    @media (prefers-color-scheme: dark) {
      .err { background: #2a1d1d; border-color: #5a3535; color: #f3b9b9; }
    }
    .thinking { color: var(--muted); }
    .dots::after {
      content: ''; animation: d 1.2s steps(4, end) infinite;
    }
    @keyframes d { 0%{content:''} 25%{content:'.'} 50%{content:'..'} 75%{content:'...'} }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    const EXAMPLES = [
      "What did Obama propose for small businesses?",
      "What did he say about clean energy?",
      "How many people cannot find work?",
      "What is his favourite pizza topping?",
    ];

    function Source({ s }) {
      const [open, setOpen] = useState(false);
      const long = s.text.length > 240;
      // Cosine similarity runs 0..1 in practice; scale for the bar only.
      const pct = Math.max(4, Math.min(100, s.score * 100));
      return (
        <div className="src">
          <div className="srctop">
            <span className="num">{s.n}</span>
            <span>{s.file}</span>
            {s.page != null && <span>· page {s.page}</span>}
            {s.page == null && s.paragraph !== null &&
              <span>· paragraph {s.paragraph}</span>}
            {s.part && <span>· part {s.part}</span>}
            <div className="bar"><i style={{ width: pct + "%" }} /></div>
            <span>{s.score.toFixed(3)}</span>
          </div>
          <div className={"srctext" + (long && !open ? " clipped" : "")}>
            {s.text}
          </div>
          {long && (
            <button className="more" onClick={() => setOpen(!open)}>
              {open ? "Show less" : "Show full paragraph"}
            </button>
          )}
        </div>
      );
    }

    function SettingsDialog({ k, setK, chunk, setChunk, open, onClose,
                              configs, reloadConfigs }) {
      const ref = useRef(null);
      const [building, setBuilding] = useState(null);
      const [err, setErr] = useState(null);
      const [uploading, setUploading] = useState(null);
      const [over, setOver] = useState(false);
      const filePick = useRef(null);

      async function send(file) {
        setErr(null);
        setUploading(file.name);
        try {
          const fd = new FormData();
          fd.append("file", file);
          const res = await fetch("/api/upload", { method: "POST", body: fd });
          const data = await res.json();
          if (data.error) setErr(data.error);
          else await reloadConfigs();
        } catch (e) {
          setErr(String(e));
        }
        setUploading(null);
        if (filePick.current) filePick.current.value = "";
      }

      async function remove(name) {
        setErr(null);
        try {
          await fetch("/api/documents/" + encodeURIComponent(name),
                      { method: "DELETE" });
          await reloadConfigs();
        } catch (e) { setErr(String(e)); }
      }

      // <dialog> is opened imperatively, so the DOM has to be told whenever
      // React's `open` prop changes. showModal() also gives Escape-to-close
      // and a focus trap for free.
      useEffect(() => {
        const d = ref.current;
        if (!d) return;
        if (open && !d.open) d.showModal();
        if (!open && d.open) d.close();
      }, [open]);

      const current = configs?.options?.find((o) => o.chunk_size === chunk);

      async function build(size) {
        setBuilding(size);
        setErr(null);
        try {
          const res = await fetch("/api/build", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ chunk_size: size }),
          });
          const data = await res.json();
          if (data.error) setErr(data.error);
          else await reloadConfigs();
        } catch (e) {
          setErr(String(e));
        }
        setBuilding(null);
      }

      return (
        <dialog ref={ref} onClose={onClose}>
          <div className="dlg">
            <h2>Documents</h2>
            <p className="hint">
              Anything you add here is what the answers come from.
              Text, Markdown or PDF.
            </p>

            <div className={"drop" + (over ? " over" : "")}
                 onClick={() => filePick.current?.click()}
                 onDragOver={(e) => { e.preventDefault(); setOver(true); }}
                 onDragLeave={() => setOver(false)}
                 onDrop={(e) => {
                   e.preventDefault(); setOver(false);
                   if (e.dataTransfer.files?.[0]) send(e.dataTransfer.files[0]);
                 }}>
              {uploading
                ? `Uploading ${uploading}…`
                : "Drop a file here, or click to choose · .txt .md .pdf"}
            </div>
            <input ref={filePick} type="file" accept=".txt,.md,.pdf"
                   style={{ display: "none" }}
                   onChange={(e) => e.target.files?.[0] && send(e.target.files[0])} />

            {configs?.documents?.map((d) => (
              <div className="doc" key={d.name}>
                <span className="kind">{d.kind}</span>
                <span className="nm" title={d.name}>{d.name}</span>
                <span className="sz">{d.kb} KB</span>
                <button className="x" title="Remove"
                        onClick={() => remove(d.name)}>×</button>
              </div>
            ))}

            <hr style={{ border: 0, borderTop: "1px solid var(--line)",
                         margin: "18px 0" }} />

            <h2>Chunk size</h2>
            <p className="hint">
              How the documents are cut up before being embedded. Smaller
              chunks are more precise; larger ones carry more context.
            </p>

            {!configs && <p className="hint">Loading…</p>}

            {configs?.options?.map((o) => (
              <div key={o.namespace}
                   className={"opt" + (o.chunk_size === chunk ? " on" : "")}
                   onClick={() => o.built && setChunk(o.chunk_size)}>
                <div className="optmain">
                  <div className="optlabel">
                    {o.label}
                    {o.chunk_size === chunk && !o.stale &&
                      <span className="tick">✓ in use</span>}
                    {o.stale && <span className="stale"> · documents changed</span>}
                  </div>
                  <div className="optmeta">
                    {o.would_make} chunks · {o.smallest}–{o.largest} chars ·
                    avg {o.average}
                  </div>
                </div>
                {o.built && !o.stale ? (
                  <span className="built">{o.vectors} vectors</span>
                ) : o.stale ? (
                  <button className="buildbtn"
                          disabled={building !== null}
                          onClick={(e) => { e.stopPropagation(); build(o.chunk_size); }}>
                    {building === o.chunk_size ? "Rebuilding…" : "Rebuild"}
                  </button>
                ) : (
                  <button className="buildbtn"
                          disabled={building !== null}
                          onClick={(e) => { e.stopPropagation(); build(o.chunk_size); }}>
                    {building === o.chunk_size
                      ? "Building…"
                      : `Build · $${o.build_cost.toFixed(4)}`}
                  </button>
                )}
              </div>
            ))}

            {building !== null && (
              <p className="hint" style={{ marginTop: 12 }}>
                Chunking, embedding and uploading — this takes 20–60 seconds.
              </p>
            )}
            {err && <p className="hint" style={{ color: "#c0392b" }}>{err}</p>}

            <p className="hint" style={{ marginTop: 16, marginBottom: 6 }}>
              Chunk size is fixed when the index is built, so each setting is
              embedded once into its own namespace. Once built, switching
              between them is instant.
            </p>

            <hr style={{ border: 0, borderTop: "1px solid var(--line)",
                         margin: "16px 0" }} />

            <h2 style={{ fontSize: 15 }}>Passages per question</h2>
            <div className="kval" style={{ fontSize: 24 }}>{k}</div>
            <input type="range" min="1" max="10" value={k}
                   onChange={(e) => setK(+e.target.value)} />
            <p className="hint" style={{ marginTop: 8, marginBottom: 0 }}>
              How many chunks get retrieved and handed to the model. 3–5 suits
              most questions; raise it when answers come back thin.
            </p>
          </div>

          <div className="dlgfoot">
            <button onClick={onClose}>Done</button>
          </div>
        </dialog>
      );
    }

    function Result({ item }) {
      if (item.error) {
        return (
          <div className="card err">
            <div className="qline">{item.question}</div>
            <strong>Something went wrong:</strong> {item.error}
          </div>
        );
      }
      if (item.loading) {
        return (
          <div className="card">
            <div className="qline">{item.question}</div>
            <span className="thinking">Searching the documents<span className="dots" /></span>
          </div>
        );
      }
      return (
        <div className="card">
          <div className="qline">{item.question}</div>
          <div className="answer">{item.answer}</div>
          {item.sources?.length > 0 && (
            <>
              <div className="srcheading">
                {item.sources.length} passages retrieved · higher score = closer match
              </div>
              {item.sources.map((s) => <Source key={s.n} s={s} />)}
            </>
          )}
        </div>
      );
    }

    function App() {
      const [status, setStatus] = useState(null);
      const [q, setQ] = useState("");
      const [k, setK] = useState(4);
      const [chunk, setChunk] = useState(null);   // null = paragraph chunking
      const [configs, setConfigs] = useState(null);
      const [dlg, setDlg] = useState(false);
      const [items, setItems] = useState([]);
      const busy = items.some((i) => i.loading);
      const box = useRef(null);

      async function reloadConfigs() {
        const r = await fetch("/api/configs");
        setConfigs(await r.json());
      }

      useEffect(() => {
        fetch("/api/status").then((r) => r.json()).then(setStatus)
          .catch((e) => setStatus({ ready: false, error: String(e) }));
        reloadConfigs().catch(() => {});
      }, []);

      async function submit(question) {
        const text = (question ?? q).trim();
        if (!text || busy) return;
        setQ("");
        const id = Date.now();
        // Newest first, so the answer appears where you are looking.
        setItems((prev) => [{ id, question: text, loading: true }, ...prev]);

        try {
          const res = await fetch("/api/ask", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ question: text, k, chunk_size: chunk }),
          });
          const data = await res.json();
          setItems((prev) => prev.map((it) =>
            it.id === id ? { ...it, ...data, loading: false } : it));
        } catch (e) {
          setItems((prev) => prev.map((it) =>
            it.id === id ? { ...it, error: String(e), loading: false } : it));
        }
      }

      function onKey(e) {
        // Enter sends, Shift+Enter makes a new line.
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); submit(); }
      }

      return (
        <div className="wrap">
          <header>
            <h1>Ask the documents</h1>
            <div className="sub">
              {status === null && "connecting…"}
              {status && status.ready && (
                <>
                  <span className="pill">Pinecone</span>
                  <span className="pill">{status.vectors} vectors</span>
                  <span className="pill">{status.chunking}</span>
                  {status.model}
                </>
              )}
              {status && !status.ready && (
                <span style={{ color: "#c0392b" }}>{status.error}</span>
              )}
            </div>
          </header>

          <div className="ask">
            <div className="row">
              <textarea
                ref={box}
                value={q}
                placeholder="Ask anything about the documents…"
                onChange={(e) => setQ(e.target.value)}
                onKeyDown={onKey}
              />
              <button onClick={() => submit()} disabled={busy || !q.trim()}>
                {busy ? "…" : "Ask"}
              </button>
            </div>

            <div className="opts">
              <button className="gear" onClick={() => setDlg(true)}>
                ⚙ Chunks: {chunk === null ? "by paragraph" : chunk + " chars"}
                {" · "}top {k}
              </button>
              <span>Enter to send · Shift+Enter for a new line</span>
            </div>

            {items.length === 0 && (
              <div className="examples">
                {EXAMPLES.map((e) => (
                  <button key={e} onClick={() => submit(e)}>{e}</button>
                ))}
              </div>
            )}
          </div>

          {items.map((it) => <Result key={it.id} item={it} />)}

          <SettingsDialog k={k} setK={setK}
                          chunk={chunk} setChunk={setChunk}
                          configs={configs} reloadConfigs={reloadConfigs}
                          open={dlg} onClose={() => setDlg(false)} />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
